  --shadow:0 10px 30px rgba(4,8,20,.45);
}

    --ink:#F6F4EE; --surface:#FFFFFF; --card:#FFFFFF; --line:#DCD6C8;

    --shadow:0 8px 24px rgba(60,50,20,.12);

:root[data-theme="dark"]{
  --ink:#0E1526; --surface:#16203A; --card:#1B2745; --line:#2A3757;
  --text:#EDF1FA; --mist:#9FB0CE; --brass:#D9A441; --brass-ink:#20180A;
  --jade:#3FBF8F; --rose:#E4707E;
  --shadow:0 10px 30px rgba(4,8,20,.45);
}
:root[data-theme="light"]{
  --ink:#F6F4EE; --surface:#FFFFFF; --card:#FFFFFF; --line:#DCD6C8;

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ink);color:var(--text);font:15px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif}
.serif{font-family:Georgia,"Times New Roman",serif}
.num{font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
input,select{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:26px;padding:14px 28px;

nav .mark{font-family:Georgia,serif;font-size:22px;letter-spacing:.5px}
nav .mark b{color:var(--brass);font-weight:700}
nav .links{display:flex;gap:20px;font-size:14px;color:var(--mist)}
nav .links a.on{color:var(--text);border-bottom:2px solid var(--brass);padding-bottom:2px}
nav .spacer{flex:1}
.badge{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);border:1px solid var(--brass);border-radius:999px;padding:3px 12px}
#themeBtn{background:none;border:1px solid var(--line);color:var(--mist);border-radius:8px;padding:5px 10px;font-size:13px}

main{max-width:1150px;margin:0 auto;padding:28px 22px 60px}
.hero{padding:44px 0 30px}
.hero .eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);margin-bottom:12px}
.hero h1{font-family:Georgia,serif;font-weight:600;font-size:clamp(30px,4.5vw,46px);line-height:1.12;margin:0 0 12px;max-width:17ch;text-wrap:balance}
.hero p{color:var(--mist);max-width:58ch;margin:0 0 24px}
.searchbar{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;background:var(--surface);

@media(max-width:820px){.searchbar{grid-template-columns:1fr 1fr}.searchbar input[type=search]{grid-column:1/-1}}

.stats b{display:block;font-family:Georgia,serif;font-size:24px;color:var(--text)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);

a.card:hover{transform:translateY(-3px)}
.thumb{height:160px;position:relative;display:flex;align-items:flex-end;padding:14px}
.thumb .district{font-family:Georgia,serif;font-size:13px;letter-spacing:.14em;color:rgba(255,255,255,.92);

footer{border-top:1px solid var(--line);color:var(--mist);font-size:12px;text-align:center;padding:22px;margin-top:30px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

const AMENITIES=[
 // Marina Bay / CBD
 ["Downtown MRT (DT17)","mrt",1.2795,103.8528],["Marina Bay MRT (NS27/TE20)","mrt",1.2761,103.8547],

 ["Marina South MRT (TE22) · ~2027","future",1.2743,103.8632],["Marina South precinct · URA Master Plan","future",1.2726,103.8618],

 ["Orchard MRT (NS22/TE14)","mrt",1.3041,103.8322],["ION Orchard","mall",1.3040,103.8318],
 ["Singapore Botanic Gardens","park",1.3138,103.8159],["Mount Elizabeth Hospital","clinic",1.3055,103.8355],
 ["Cold Storage Takashimaya","supermarket",1.3029,103.8349],["Orchard Boulevard MRT (TE13)","mrt",1.3023,103.8253],
 // Tampines
 ["Tampines MRT (EW2/DT32)","mrt",1.3546,103.9450],["Tampines Mall","mall",1.3525,103.9447],
 ["Our Tampines Hub","sports",1.3536,103.9402],["St. Hilda's Primary School","school",1.3499,103.9455],
 ["Tampines Eco Green","park",1.3592,103.9367],["Cross Island Line (Tampines North) · ~2030","future",1.3690,103.9380],

/* ============ Finance engine (ported from @propos/finance) ============ */
const fmt=n=>new Intl.NumberFormat("en-SG",{style:"currency",currency:"SGD",maximumFractionDigits:0}).format(n);
const nfmt=n=>Math.round(n).toLocaleString("en-SG");
const BSD_TIERS=[[180000,.01],[360000,.02],[1000000,.03],[1500000,.04],[3000000,.05],[Infinity,.06]];
const ABSD={citizen:[0,.20,.30],pr:[.05,.30,.35],foreigner:[.60,.60,.60],entity:[.65,.65,.65]};
function bsd(price){let rem=price,prev=0,amt=0;for(const[cap,rate]of BSD_TIERS){if(rem<=0)break;
  const band=Math.min(rem,cap-prev);amt+=band*rate;rem-=band;prev=cap}return Math.round(amt)}
function absd(price,profile,owned){const r=ABSD[profile];return Math.round(price*r[Math.min(owned,r.length-1)])}
function pmt(P,ratePct,years){const n=years*12,r=ratePct/100/12;if(!n||P<=0)return 0;
  return r===0?P/n:P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1)}
const sqft=sqm=>Math.round(sqm*10.7639);
const psf=(price,sqm)=>Math.round(price/sqft(sqm));

/* ============ Area intelligence (ported from @propos/area-intelligence) ============ */
function distM(a,b){const R=6371000,t=d=>d*Math.PI/180;
  const dLat=t(b[0]-a[0]),dLng=t(b[1]-a[1]);
  const h=Math.sin(dLat/2)**2+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h))}
const walkMin=d=>Math.max(1,Math.round(d*1.3/80));
function prox(d,full,zero){return d<=full?1:d>=zero?0:1-(d-full)/(zero-full)}
function areaReport(geo){
  const near=AMENITIES.map(a=>({...a,d:Math.round(distM(geo,[a.lat,a.lng]))}))
    .filter(a=>a.d<=1800).sort((a,b)=>a.d-b.d);
  const first=c=>near.find(a=>a.cat===c);
  const pct=x=>Math.round(Math.max(0,Math.min(1,x))*100);
  const mrt=first("mrt");
  const transit=pct((mrt?prox(mrt.d,400,1600):0));
  const daily=["supermarket","market","mall","clinic","park"];
  const walk=pct(daily.reduce((s,c)=>{const n=first(c);return s+(n?prox(n.d,300,1200):0)},0)/daily.length);
  const sch=first("school");
  const fam=pct(((sch?prox(sch.d,1000,2000):0)+(first("park")?0.7:0))/1.7);
  const life=pct(Math.min(1,near.filter(a=>["mall","market","sports","park"].includes(a.cat)).length/5));
  const future=near.filter(a=>a.cat==="future");
  const invest=pct(transit/100*.5+Math.min(1,future.length/2)*.5);
  const overall=Math.round(transit*.28+walk*.26+fam*.14+life*.14+invest*.18);
  let summary=(overall>=80?"Outstanding location. ":overall>=55?"Well-connected location. ":"Tranquil, low-density setting. ");
  if(mrt)summary+=`${mrt.name} is a ${walkMin(mrt.d)}-min walk (${mrt.d} m). `;
  if(sch)summary+=`${sch.name} is ${sch.d} m away. `;
  if(future.length)summary+=`Upcoming nearby: ${future.map(f=>f.name).join("; ")} — a tailwind for long-term value.`;
  return {near,scores:{Transit:transit,Walkability:walk,Families:fam,Lifestyle:life,Investment:invest},overall,summary,future};
}

/* ============ AI content engine (ported from @propos/ai-engine, template mode) ============ */
function facts(l){
  return {name:l.name,addr:l.addr,district:l.district,beds:l.beds,baths:l.baths,area:nfmt(sqft(l.sqm)),
    price:l.intent==="rent"?fmt(l.price)+"/mo":fmt(l.price),psf:l.intent==="sale"?nfmt(psf(l.price,l.sqm)):null,
    tenure:l.tenure,feat:l.features,deal:l.intent==="sale"?"for sale":"for rent",type:l.type==="hdb"?"HDB flat":l.type};
}
const featLine=f=>f.feat.length?` Highlights: ${f.feat.join(", ")}.`:"";
const CHANNELS={
 "Description":f=>`${f.beds}-Bedroom ${f.type} at ${f.addr}\n\nPresenting a ${f.beds}-bedroom, ${f.baths}-bathroom ${f.type} ${f.deal} in ${f.district}. Spanning ${f.area} sqft on a ${f.tenure.toLowerCase()} title, offered at ${f.price}${f.psf?` (S$${f.psf} psf)`:""}.${featLine(f)} Arrange a viewing today and experience it for yourself.`,
 "SEO":f=>`${f.beds}-bedroom ${f.type} ${f.deal} in ${f.district} — ${f.area} sqft, ${f.price}${f.psf?`, S$${f.psf} psf`:""}, ${f.tenure.toLowerCase()}. View photos, floor plan, area insights and mortgage estimates on PropOS.`,

/* ============ AI sales agent (rule-based, numbers from the engine) ============ */
const DISC=" (Planning estimate, not financial advice.)";
function agentAnswer(l,q,profile,owned){
  q=q.toLowerCase();
  const isSale=l.intent==="sale";
  if(/(stamp|absd|bsd|duty)/.test(q)){
    if(!isSale)return "Stamp duty applies to purchases; this is a rental. Lease duty is typically 0.4% of total rent over the lease term."+DISC;
    const b=bsd(l.price),a=absd(l.price,profile,owned);
    return `For a ${profile} buying property #${owned+1} at ${fmt(l.price)}: BSD ≈ S$${nfmt(b)}, ABSD ≈ S$${nfmt(a)} — total ≈ S$${nfmt(b+a)}.`+DISC;
  }
  if(/(loan|mortgage|instal|month|repay|payment)/.test(q)){
    if(!isSale)return `Monthly rent is ${fmt(l.price)}. Typical requirements: 1-month deposit per year of lease plus the first month's rent.`;
    const loan=l.price*.75,m=pmt(loan,3,30);
    return `With a 75% loan (S$${nfmt(loan)}) at 3% p.a. over 30 years, the instalment is about S$${nfmt(m)}/month. I can rerun it with your income and rate.`+DISC;
  }
  if(/(yield|invest|roi|rental income)/.test(q)&&isSale){
    const rent=Math.round(l.price*.035/12),y=(rent*12/l.price*100).toFixed(2);
    return `At an estimated rent of S$${nfmt(rent)}/month, gross yield is about ${y}%. Ask for the full brief — cash flow, comparables, and area appreciation.`+DISC;
  }
  if(/(price|how much|asking|cost)/.test(q))
    return `The asking ${isSale?"price":"rent"} is ${l.intent==="rent"?fmt(l.price)+" per month":fmt(l.price)}${isSale?` — about S$${nfmt(psf(l.price,l.sqm))} psf`:""}. The ${isSale?"seller":"landlord"} is open to serious offers. Want a viewing?`;
  if(/(school|mrt|near|amenit|transport|area|around)/.test(q)){
    const r=areaReport(l.geo),m=r.near.find(a=>a.cat==="mrt"),s=r.near.find(a=>a.cat==="school");
    return `${m?`${m.name} is ${m.d} m away (${walkMin(m.d)}-min walk). `:"No MRT within walking distance — this is a car-friendly enclave. "}${s?`${s.name} is ${s.d} m away. `:""}Overall area score: ${r.overall}/100. The full report is on this page.`;
  }
  if(/(view|visit|appoint|see|available|book)/.test(q))
    return "I'd love to show you the place! Viewings run daily 10am–8pm. Share a day and time and I'll confirm with the agent right away.";
  return "I can answer instantly on price, stamp duty, loan estimates, rental yield, the neighbourhood, or book you a viewing — which would you like?";
}

/* ---- interactions ---- */
const state={filters:{q:"",intent:"all",type:"all",max:"all"}};
function doSearch(e){e.preventDefault();
  state.filters={q:document.getElementById("q").value,intent:document.getElementById("fIntent").value,
    type:document.getElementById("fType").value,max:document.getElementById("fMax").value};
  render();return false}
function wireTabs(tabsId,outId,fn){
  const tabs=document.getElementById(tabsId);if(!tabs)return;
  tabs.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    tabs.querySelectorAll("button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");document.getElementById(outId).textContent=fn(b.dataset.k)});
}
let currentListing=null;
function calcDuty(l){
  l=l||currentListing;if(!l)return;
  const p=document.getElementById("dProfile"),o=document.getElementById("dOwned");if(!p)return;
  const b=bsd(l.price),a=absd(l.price,p.value,+o.value);
  document.getElementById("dutyOut").innerHTML=
    `<li><span>Buyer's Stamp Duty</span><b>S$${nfmt(b)}</b></li>
     <li><span>ABSD (${esc(p.value)}, #${+o.value+1})</span><b>S$${nfmt(a)}</b></li>
     <li><span>Total duty</span><b style="color:var(--brass)">S$${nfmt(b+a)}</b></li>`;
}
function calcLoan(l){
  l=l||currentListing;if(!l)return;
  const r=document.getElementById("mRate"),y=document.getElementById("mYears");if(!r)return;
  const loan=l.price*.75,m=pmt(loan,+r.value,+y.value);
  document.getElementById("loanOut").innerHTML=
    `<li><span>Loan (75% LTV)</span><b>S$${nfmt(loan)}</b></li>
     <li><span>Monthly instalment</span><b style="color:var(--brass)">S$${nfmt(m)}</b></li>
     <li><span>Total interest</span><b>S$${nfmt(m*+y.value*12-loan)}</b></li>`;
}
function sendChat(l){
  const inp=document.getElementById("chatIn"),q=inp.value.trim();if(!q)return;
  const chat=document.getElementById("chat");
  const p=document.getElementById("dProfile"),o=document.getElementById("dOwned");
  chat.insertAdjacentHTML("beforeend",`<div class="msg u">${esc(q)}</div>`);
  const a=agentAnswer(l,q,p?p.value:"citizen",o?+o.value:0);
  chat.insertAdjacentHTML("beforeend",`<div class="msg b">${esc(a)}</div>`);
  inp.value="";chat.scrollTop=1e6;
}
function advanceLead(name){
  const x=LEADS.find(z=>z.n===name);
  if(x&&x.s<STAGES.length-1){x.s++;render()}
}
function calcComm(){
  const g=+document.getElementById("cPrice").value*(+document.getElementById("cPct").value/100);
  const co=g*(+document.getElementById("cCo").value/100);
  const agentPct=+document.getElementById("cAgent").value;
  const rem=g-co,agent=rem*agentPct/100,agency=rem-agent;
  document.getElementById("commOut").innerHTML=
    `<li><span>Gross commission</span><b>S$${nfmt(g)}</b></li>
     <li><span>Co-broke</span><b>S$${nfmt(co)}</b></li>
     <li><span>Agent takes</span><b style="color:var(--brass)">S$${nfmt(agent)}</b></li>
     <li><span>Agency</span><b>S$${nfmt(agency)}</b></li>`;
}

/* ---- router & theme ---- */
function render(){
  const h=location.hash||"#/";
  let view="home",html;
  if(h.startsWith("#/listing/")){currentListing=LISTINGS.find(x=>x.id===+h.split("/")[2])||null;html=listingView(h.split("/")[2])}
  else if(h==="#/agents"){view="agents";html=agentsView()}
  else if(h==="#/global"){view="global";html=globalView()}
  else{html=homeView()}
  app.innerHTML=html;
  document.querySelectorAll("[data-nav]").forEach(a=>a.classList.toggle("on",a.dataset.nav===view&&!h.startsWith("#/listing/")));
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);
document.getElementById("themeBtn").onclick=()=>{
  const r=document.documentElement;
  const dark=getComputedStyle(document.body).backgroundColor!=="rgb(246, 244, 238)"; // currently dark?
  r.dataset.theme=dark?"light":"dark";
};
render();
</script>
